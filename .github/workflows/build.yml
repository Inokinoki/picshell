name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test test/

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"

      - name: Build signed APK
        # The signing config is read by Gradle from the environment, not from
        # --dart-define (which is for Dart code and was silently ignored).
        env:
          KEYSTORE_PATH: debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: picshell-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
