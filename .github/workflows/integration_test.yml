name: Integration Tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      # The SSH integration tests need a real sshd on 127.0.0.1:2222 with
      # root/testpass (the credentials they are written against). Build and
      # run the throwaway target from the repo's test Dockerfile, then map
      # the emulator's localhost:2222 onto it with adb reverse.
      - name: Start sshd test container
        run: |
          docker build -t picshell-sshd:local -f Dockerfile.sshd .
          docker run -d --name picshell-sshd -p 2222:22 picshell-sshd:local
          sleep 3
          docker logs picshell-sshd

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run unit tests
        run: flutter test test/

      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: |
            adb reverse tcp:2222 tcp:2222
            flutter test integration_test/ -d emulator-5554

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots
          path: |
            build/reports/
            integration_test/screenshots/
          retention-days: 7
          if-no-files-found: ignore
