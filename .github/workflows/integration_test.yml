name: Integration Tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build and run the throwaway sshd (with SFTP subsystem) that the
      # integration tests connect to. Publish it on host port 2222; the
      # Android emulator reaches the host loopback via 10.0.2.2.
      - name: Start sshd container
        run: |
          docker build -f Dockerfile.sshd -t picshell-sshd-test .
          docker run -d --name sshd -p 2222:2222 picshell-sshd-test
          # Wait until the port accepts connections.
          for i in $(seq 1 20); do
            if nc -z localhost 2222; then echo "sshd up"; break; fi
            sleep 1
          done

      - name: Run unit tests
        run: flutter test test/

      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # String.fromEnvironment is a compile-time constant, so the SSH
          # target must be passed via --dart-define (NOT process env vars).
          # 10.0.2.2 is the emulator's alias for the host loopback, where the
          # sshd container is published; credentials match Dockerfile.sshd.
          script: >
            flutter test integration_test/ -d emulator-5554
            --dart-define=TEST_SSH_HOST=10.0.2.2
            --dart-define=TEST_SSH_PORT=2222
            --dart-define=TEST_SSH_USER=root
            --dart-define=TEST_SSH_PASS=testpass

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots
          path: |
            build/reports/
            integration_test/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  # Desktop jobs run the same integration_test/ suite as Android, against the
  # same throwaway sshd (Docker container on Linux; native sshd with matching
  # fixtures on Windows/macOS, where Docker isn't available on runners).
  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      # Toolchain required to build the Flutter Linux desktop runner.
      # libsecret-1/libjsoncpp are demanded by flutter_secure_storage_linux's
      # CMake pkg-config check, on top of the base GTK toolchain.
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - run: flutter config --enable-linux-desktop

      # Same throwaway sshd container as the Android job (Dockerfile.sshd
      # ships the SFTP marker and OSC 1337 fixtures the tests assert on).
      # The desktop app dials the host loopback directly — no emulator hop.
      - name: Start sshd container
        run: |
          docker build -f Dockerfile.sshd -t picshell-sshd-test .
          docker run -d --name sshd -p 2222:2222 picshell-sshd-test
          for i in $(seq 1 20); do
            if nc -z localhost 2222; then echo "sshd up"; break; fi
            sleep 1
          done

      - name: Run Linux integration tests
        # Desktop integration tests must run one file per invocation: within
        # a single `flutter test`, every file after the first fails to launch
        # the app ("Error waiting for a debug connection") — a known
        # flutter_tools desktop limitation. xvfb provides the X display the
        # GTK runner needs.
        run: |
          set -e
          for f in integration_test/*_test.dart; do
            xvfb-run -a flutter test "$f" -d linux \
              --dart-define=TEST_SSH_HOST=127.0.0.1 \
              --dart-define=TEST_SSH_PORT=2222 \
              --dart-define=TEST_SSH_USER=root \
              --dart-define=TEST_SSH_PASS=testpass
          done

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots-linux
          path: |
            build/reports/
            integration_test/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      # Native Win32-OpenSSH stands in for the throwaway sshd container.
      # Git Bash is configured as the sshd default shell so the tests'
      # `bash /tmp/send.sh` works (MSYS maps /tmp to the logging-in user's
      # %TEMP%), and the Dockerfile.sshd fixtures are recreated natively.
      - name: Install and configure sshd
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online |
            Where-Object Name -like 'OpenSSH.Server*' |
            Select-Object -First 1
          if ($cap.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $cap.Name | Out-Null
          }
          New-Item -Path "HKLM:\SOFTWARE\OpenSSH" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell `
            -Value "C:\Program Files\Git\bin\bash.exe" -PropertyType String `
            -Force | Out-Null
          # Mirror Dockerfile.sshd: explicit password auth and the relaxed
          # MaxStartups that tolerates the tests' burst of connections.
          # The stock config ENDS with a `Match Group administrators` block;
          # appending directives after it lands them inside the Match scope
          # and sshd aborts at startup ("Directive ... is not allowed within
          # a Match block"). So strip any existing copies and PREPEND.
          $cfg = "C:\ProgramData\ssh\sshd_config"
          $kept = Get-Content $cfg |
            Where-Object { $_ -notmatch '^\s*#?\s*(PasswordAuthentication|MaxStartups)\b' }
          $directives = @('PasswordAuthentication yes', 'MaxStartups 50:30:100')
          Set-Content -Path $cfg -Value ($directives + $kept)

          Set-Service sshd -StartupType Automatic
          if ((Get-Service sshd).Status -eq 'Running') {
            Restart-Service sshd
          } else {
            # Fresh capability installs occasionally need a moment before the
            # service will start; retry instead of failing on the first try.
            $started = $false
            for ($i = 0; $i -lt 5; $i++) {
              Start-Service sshd -ErrorAction SilentlyContinue
              if ((Get-Service sshd).Status -eq 'Running') { $started = $true; break }
              Start-Sleep -Seconds 2
            }
            if (-not $started) { throw "sshd failed to start" }
          }
          # Password-protect the built-in admin account the tests log in as
          # (its profile already exists on the image). The password must
          # satisfy the Windows complexity policy (upper+lower+digit+special)
          # — a plain-word password throws InvalidPasswordException.
          $pw = ConvertTo-SecureString 'Testpass123!' -AsPlainText -Force
          Set-LocalUser -Name runneradmin -Password $pw

      - name: Create sshd fixtures
        shell: pwsh
        run: |
          # Win32-OpenSSH's SFTP didn't list a marker written to C:\ as '/', so
          # keep it in the login user's home (whose absolute DOS-style path the
          # sftp server accepts directly) and point TEST_SSH_SFTP_DIR at it.
          $home_ = "C:\Users\runneradmin"
          [IO.File]::WriteAllText("$home_\picshell_sftp_marker.txt", "picshell-sftp-smoke`n")
          # OSC 1337 emitter, same as Dockerfile.sshd's /tmp/send.sh. Git Bash
          # maps /tmp to runneradmin's %TEMP%; bash rejects CRLF, so write
          # with LF endings.
          $send = @'
          #!/bin/bash
          B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC"
          printf "\033]1337;File=inline=1;name=dC5wbmc=;width=80;height=40:%s\a\n" "$B64"
          '@ -replace "`r`n", "`n"
          [IO.File]::WriteAllText("$home_\AppData\Local\Temp\send.sh", $send)

      - name: Wait for sshd
        shell: pwsh
        run: |
          $up = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-NetConnection 127.0.0.1 -Port 22 `
                  -InformationLevel Quiet -WarningAction SilentlyContinue) {
              $up = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $up) { throw "sshd did not come up on port 22" }

      - name: Run Windows integration tests
        # One file per invocation — see the Linux job note. bash (Git Bash)
        # for the loop; the app itself is the Windows desktop runner.
        shell: bash
        run: |
          set -e
          for f in integration_test/*_test.dart; do
            flutter test "$f" -d windows \
              --dart-define=TEST_SSH_HOST=127.0.0.1 \
              --dart-define=TEST_SSH_PORT=22 \
              --dart-define=TEST_SSH_USER=runneradmin \
              --dart-define=TEST_SSH_PASS=Testpass123! \
              --dart-define=TEST_SSH_SFTP_DIR=C:/Users/runneradmin
          done

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots-windows
          path: |
            build/reports/
            integration_test/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  macos-integration:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      # Native sshd (Remote Login) stands in for the throwaway sshd container
      # — macOS runners have no Docker. The image's managed `runner` account
      # cannot have its password reset (dscl -passwd fails with eDSAuthFailed),
      # so a dedicated password-login user is created for the tests, and the
      # Dockerfile.sshd fixtures are recreated natively.
      - name: Enable sshd and create test fixtures
        run: |
          sudo systemsetup -f -setremotelogin on
          # Keep -password immediately after -addUser: sysadminctl's argument
          # parsing is picky about interleaved flags, and a silently unset
          # password kills the whole test suite at SSH auth.
          sudo sysadminctl -addUser testuser -password testpass
          # Belt and braces: re-set the password through dscl (works for
          # users we just created, unlike the protected runner account) in
          # case sysadminctl's storage didn't land in a form OpenDirectory
          # verifies over sshd.
          sudo dscl . -passwd /Users/testuser testpass
          sudo dscl . -create /Users/testuser UserShell /bin/bash
          sudo createhomedir -c -u testuser >/dev/null 2>&1 || true
          # SFTP marker, as in Dockerfile.sshd. The runner's system volume is
          # sealed (read-only root), so the marker lives in /private/tmp and
          # the tests get its directory via TEST_SSH_SFTP_DIR.
          echo 'picshell-sftp-smoke' | sudo tee /private/tmp/picshell_sftp_marker.txt >/dev/null
          # OSC 1337 emitter, same as Dockerfile.sshd's /tmp/send.sh.
          printf '%s\n' \
            '#!/bin/bash' \
            'B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC"' \
            'printf "\033]1337;File=inline=1;name=dC5wbmc=;width=80;height=40:%s\a\n" "$B64"' \
            > /tmp/send.sh
          chmod +x /tmp/send.sh
          # Make sure password auth is on, then bounce sshd to apply config.
          sudo sed -i '' 's/^#\{0,1\}PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          grep -q '^PasswordAuthentication yes' /etc/ssh/sshd_config || \
            echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          # sysadminctl-created users have no Kerberos principal, and pam_krb5
          # failing to determine one ABORTS the whole PAM authentication
          # (sshd closes the connection preauth; confirmed in the unified
          # log: "pam_sm_authenticate(): Failed to determine Kerberos
          # principal name"). Mark it optional — pam_opendirectory still
          # verifies the password itself.
          sudo grep -n pam_krb5 /etc/pam.d/sshd || true
          # BSD sed has no alternation, hence perl. The leading `.*` on the
          # match drops pam_krb5's own args (use_kcminit etc.) — fine for a
          # module whose result we no longer care about.
          sudo perl -pi -e \
            's/^auth\s+(?:required|sufficient|requisite)\s+pam_krb5\.so\b.*/auth\toptional\tpam_krb5.so/' \
            /etc/pam.d/sshd
          sudo grep -n pam_krb5 /etc/pam.d/sshd || true
          sudo launchctl enable system/com.openssh.sshd || true
          sudo launchctl kickstart -k system/com.openssh.sshd || true
          for i in $(seq 1 30); do
            if nc -z localhost 22; then echo "sshd up"; break; fi
            sleep 1
          done

          # Smoke-test the password login BEFORE the minutes-long test suite,
          # and on failure dump sshd's effective config and its own logs so
          # the root cause is visible from the run output alone.
          sudo sshd -T 2>/dev/null | grep -Ei '^(passwordauthentication|kbdinteractiveauthentication|usepam|authenticationmethods)'
          out=$(expect -c '
            set timeout 30
            spawn ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                     -o PubkeyAuthentication=no -o PreferredAuthentications=password \
                     -p 22 testuser@127.0.0.1 echo pw-login-verified
            expect {
              -re "(?i)password:" { send "testpass\r"; exp_continue }
              eof
            }
          ')
          echo "$out"
          # Start-anchor only (the line may carry a trailing CR from the ssh
          # client): the marker also appears verbatim in the spawned command
          # line, but that line starts with "spawn ssh".
          echo "$out" | tr -d '\r' | grep -q "^pw-login-verified" || {
            echo "::error::password SSH login failed; recent sshd logs follow"
            sudo log show --last 5m --info \
              --predicate 'process CONTAINS "sshd"' --style compact | tail -80
            exit 1
          }

      - name: Run macOS integration tests
        # One file per invocation — see the Linux job note.
        run: |
          set -e
          for f in integration_test/*_test.dart; do
            flutter test "$f" -d mac \
              --dart-define=TEST_SSH_HOST=127.0.0.1 \
              --dart-define=TEST_SSH_PORT=22 \
              --dart-define=TEST_SSH_USER=testuser \
              --dart-define=TEST_SSH_PASS=testpass \
              --dart-define=TEST_SSH_SFTP_DIR=/private/tmp
          done

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots-macos
          path: |
            build/reports/
            integration_test/screenshots/
          retention-days: 7
          if-no-files-found: ignore
