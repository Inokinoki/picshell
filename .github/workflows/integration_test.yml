name: Integration Tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build and run the throwaway sshd (with SFTP subsystem) that the
      # integration tests connect to. Publish it on host port 2222; the
      # Android emulator reaches the host loopback via 10.0.2.2.
      - name: Start sshd container
        run: |
          docker build -f Dockerfile.sshd -t picshell-sshd-test .
          docker run -d --name sshd -p 2222:2222 picshell-sshd-test
          # Wait until the port accepts connections.
          for i in $(seq 1 20); do
            if nc -z localhost 2222; then echo "sshd up"; break; fi
            sleep 1
          done

      - name: Run unit tests
        run: flutter test test/

      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The emulator's 10.0.2.2 resolves to the host loopback, where the
          # sshd container is published. Credentials match Dockerfile.sshd.
          TEST_SSH_HOST: 10.0.2.2
          TEST_SSH_PORT: 2222
          TEST_SSH_USER: root
          TEST_SSH_PASS: testpass
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: flutter test integration_test/ -d emulator-5554

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots
          path: |
            build/reports/
            integration_test/screenshots/
          retention-days: 7
          if-no-files-found: ignore
